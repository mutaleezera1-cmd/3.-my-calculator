name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev xclip libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev lld openjdk-17-jdk unzip zip
        pip install --upgrade Cython==0.29.33 buildozer

    - name: Package Application
      run: |
        buildozer init
        sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
        buildozer -v android debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: CastTigerCalculator-APK
        path: bin/*.apk
        
          
